apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR-ORG/gitops-demo.git
    targetRevision: main
    path: apps/flask-app/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: flask-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

